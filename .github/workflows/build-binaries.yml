name: Build desktop executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: StreckenbuchExport-windows-x86_64
          - os: macos-15
            artifact: StreckenbuchExport-macos-arm64
          - os: macos-15-intel
            artifact: StreckenbuchExport-macos-x86_64
          - os: ubuntu-latest
            artifact: StreckenbuchExport-linux-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --group dev --python 3.12

      - name: Run tests
        run: uv run pytest

      - name: Build desktop executable
        run: uv run pyinstaller --noconfirm --clean streckenbuch_export.spec

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive `
            -Path dist/StreckenbuchExport.exe `
            -DestinationPath release/${{ matrix.artifact }}-${{ github.ref_name }}.zip

      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            dist/StreckenbuchExport.app \
            release/${{ matrix.artifact }}-${{ github.ref_name }}.zip

      - name: Package Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release
          tar -C dist -czf \
            release/${{ matrix.artifact }}-${{ github.ref_name }}.tar.gz \
            StreckenbuchExport

      - name: Upload packaged executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create release and attach downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Streckenbuch Export ${GITHUB_REF_NAME}" \
            --generate-notes
